[project]
name = "nlp-humor-generator"
version = "0.1.0"
description = "Product-grounded humor generation, detector ranking and LoRA fine-tuning"
requires-python = "==3.11.*"
dependencies = [
  "transformers==4.57.1",
  "torch==2.8.0",
  "huggingface-hub==0.36.2",
  "tokenizers==0.22.2",
  "numpy==2.2.6",
  "peft==0.17.1",
  "trl==0.23.1",
  "datasets==4.2.0",
  "accelerate==1.10.1",
  "bitsandbytes==0.48.1",
  "safetensors==0.8.0",
  "openpyxl==3.1.5",
  "sentencepiece>=0.2,<0.3",
  "protobuf>=4.25,<7",
]

[tool.uv]
package = false
required-version = ">=0.11.1"
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
